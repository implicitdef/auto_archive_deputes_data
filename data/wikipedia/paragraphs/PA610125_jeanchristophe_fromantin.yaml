- >-
  Jean-Christophe Fromantin, né le 30 août 1962 à Nantes (Loire-Atlantique), est
  un chef d'entreprise et homme politique français de centre droit, membre de
  l'UDI puis indépendant.
- >-
  Jean-Christophe Fromantin est maire de Neuilly-sur-Seine depuis 2008. Après
  avoir lancé le parti Territoires en mouvement, il est élu député des
  Hauts-de-Seine entre 2012 et 2017. En 2021, il est élu vice-président du
  Conseil départemental des Hauts-de-Seine.
- Biographie
- Formation et famille
- >-
  Jean-Christophe Fromantin fait ses études secondaires dans différents
  établissements scolaires à Saintes, Dunkerque et Strasbourg, où il obtient son
  bac en 1981. Après une année de sciences économiques et une autre en classe
  préparatoire, il intègre l’École supérieure libre des sciences commerciales
  appliquées (ESLSCA) et en sort diplômé en 1986.
- >-
  En 2025, Jean-Christophe Fromantin soutient une thèse à l'IAE de Paris
  (Université Paris–Panthéon-Sorbonne), portant sur l'avenir des quartiers
  d'affaires. Il est docteur en sciences de gestion.
- >-
  Il est marié et père de quatre enfants. Sportif, il est adepte de voile (il
  participe au Tour de France à la voile en 1980[réf. nécessaire]), de course à
  pied (marathon[réf. nécessaire]) et de vélo.
- Carrière professionnelle
- >-
  Entre 1987 et 1988, il effectue son service national comme coopérant à
  Lisbonne dans un groupe pharmaceutique. À son retour en 1989, il s’installe à
  Neuilly et crée Eurochallenge, une société de services et de conseils pour
  l'import-export. À la suite de la fusion avec Interex en 1994, il prend la
  direction de la société nouvellement créée, Export Entreprises, qui participe
  en 2009 au lancement du site Globaltrade.net, issu d'un partenariat
  public-privé entre le département du Commerce des États-Unis et la Fédération
  des associations du commerce international (FITA).
- >-
  À partir de 2019, en parallèle à ses mandats politiques, il travaille comme
  Délégué général de l'association Anticipations, prestataire de formation.
- Parcours politique
- Maire de Neuilly-sur-Seine (2008-…)
- >-
  Candidat divers droite, il se présente à l'élection municipale de 2008 à
  Neuilly-sur-Seine. Il se retrouve opposé à la municipalité d'alors, puis à
  David Martinon soutenu par Nicolas Sarkozy qui était lui-même maire de cette
  ville de 1983 à 2001.
- >-
  Au second tour, la liste qu'il conduit l'emporte avec 61,67 % des voix contre
  38,33 % à celle de son rival. Il est élu maire de la ville le 23 mars 2008,
  lors du premier conseil municipal, par 37 voix contre 8 à Arnaud Teullé au
  terme d'une campagne houleuse.
- >-
  Le 10 juin 2009, Jean-Christophe Fromantin est élu au bureau du Syndicat mixte
  Paris Métropole présidé par le socialiste Jean-Yves Le Bouillonnec. Le 8
  novembre 2010, il devient vice-président de Paris Métropole aux côtés du
  nouveau président Jacques J. P. Martin, maire UMP de Nogent-sur-Marne.
- >-
  Candidat aux élections cantonales de mars 2011 dans le canton Nord de
  Neuilly-sur-Seine, il obtient la majorité absolue au premier tour, mais n'est
  pas élu, car il ne réunit pas assez de suffrages : 21 % des inscrits
  seulement. Au second tour, le 27 mars 2011, obtenant 70,24 % des suffrages
  exprimés, il est élu face à Marie-Cécile Ménard, conseillère sortante soutenue
  par l'UMP.
- >-
  À deux reprises, en 2014 et en 2020, Jean-Christophe Fromantin est réélu maire
  de Neuilly-sur-Seine dès le 1er tour. Le 15 mars 2020, il obtient 60,25 % des
  voix. Aux présidentielles 2022, il affiche son soutien à Valérie Pécresse.
- Député des Hauts-de-Seine (2012-2017)
- >-
  En juin 2012, au premier tour des élections législatives dans la sixième
  circonscription des Hauts-de-Seine, Jean-Christophe Fromantin obtient 59,86 %
  des voix, loin devant Bernard Lepidi (divers droite, 19,92 %) et Marie
  Brannens (PS, 9,18 %).
- >-
  À l'issue du deuxième tour, le 17 juin 2012, Jean-Christophe Fromantin est élu
  député des Hauts-de-Seine avec 69,51 % des voix, face à la candidate du PS
  Marie Brannens (10,65 %) et à Bernard Lepidi (19,84 %).
- >-
  En décembre 2012, il cède son siège de conseiller général à sa suppléante
  Alexandra Fourcade, 8e adjoint au maire de Neuilly-sur-Seine chargée des
  Affaires sociales et de la Santé.
- En 2013, il milite contre le droit au mariage homosexuel.
- >-
  En mai 2014, il se déclare candidat à la présidence de l'UDI (Union des
  démocrates et indépendants). À l'issue du premier tour, il arrive en quatrième
  position, obtenant 11,1 % des suffrages exprimés. Il soutient Hervé Morin au
  second tour.
- >-
  Le 26 novembre 2014, il fait partie des sept députés à voter contre une
  proposition de résolution « visant à réaffirmer le droit fondamental à
  l'interruption volontaire de grossesse en France ». 143 députés ont voté pour.
- >-
  Le 6 décembre 2015, il annonce son départ de l'UDI à la suite des résultats du
  premier tour des élections régionales.
- >-
  En mars 2017, il annonce ne pas être candidat à sa réélection en tant que
  député.
- >-
  En juin 2021, il est élu au Conseil départemental des Hauts-de-Seine, dont il
  devient vice-président.
- Candidat comme député européen en 2024
- >-
  Dans le cadre des élections européennes de juin 2024, Jean-Christophe
  Fromantin annonce constituer une liste, appelée Notre Europe et portée par
  Territoires en Mouvement. Avec Bertrand Pancher, président du groupe LIOT, il
  travaille à un rapprochement afin de constituer une liste commune.
  L'initiative n'est pas couronnée de succès.
- Prises de position
- >-
  Il milite contre le droit au mariage pour les personnes de même sexe et
  suscite la polémique au sein de son groupe politique pour son opposition au
  projet de loi de 2014 faisant de l'avortement un droit fondamental.
- Candidature de la France à l'Exposition universelle de 2025
- >-
  À partir de 2011, Jean-Christophe Fromantin pousse l'idée d'une candidature de
  la France pour l'exposition universelle de 2025. Il préside le comité
  ExpoFrance 2025 chargé de cette candidature, qui est retirée par le Premier
  ministre Édouard Philippe en janvier 2018, évoquant des faiblesses
  structurelles du projet. Pour lui et les organisateurs du projet, le retrait
  de la candidature sert surtout à masquer le retard pris par la construction de
  la ligne 18 du Grand Paris Express.
