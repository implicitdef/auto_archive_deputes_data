- Personnage dans la fiction
- >-
  En 2011, Jean-Christophe Fromantin accède à la célébrité quand une marionnette
  à son effigie joue dans un sketch des Guignols de l'info où toute la famille
  Sarkozy trahit Nicolas, alors au plus bas dans les sondages.
