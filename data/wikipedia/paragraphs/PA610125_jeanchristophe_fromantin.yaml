- Prix
- >-
  En 2021, Jean-Christophe Fromantin reçoit d' "Écologie responsable", un
  think-thank de droite, le prix de l’Enracinement – Simone Weil pour
  récompenser « une personnalité qui œuvre à la fois pour l’écologie et
  l’innovation ».
